[package]
name = "tuckdb"
version = "0.1.0"
edition = "2024"

[dependencies]
zstd = "0.13"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
sqlparser = { version = "0.55", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"

[features]
default = ["sqlparser"]
s3 = ["aws-sdk-s3", "aws-config", "tokio"]
capi = ["libc", "sqlparser"]

[[bench]]
name = "benchmarks"
harness = false
